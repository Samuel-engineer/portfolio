version: 1
applications:
  # L'app front vit dans web/ : Amplify s'y place avant d'exécuter les commandes.
  # Doit correspondre à la variable d'environnement AMPLIFY_MONOREPO_APP_ROOT.
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
